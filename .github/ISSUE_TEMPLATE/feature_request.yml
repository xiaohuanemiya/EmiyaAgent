name: 功能建议
description: 提议新的能力、接口或工程改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请从用户问题和可验证结果出发，而不只描述某个实现。较大的协议或安全边界变化建议先讨论设计。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我搜索过现有 issue 和路线图，未发现相同建议。
          required: true
        - label: 这不是安全漏洞；安全问题将通过私下报告渠道提交。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前工作流、受影响用户和可观察的限制。避免先假定具体实现。
      placeholder: "当……时，我需要……，目前会……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望的 CLI、配置、工具或协议行为，并给出最小示例。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 列出可以通过测试或人工检查验证的结果。
      placeholder: |
        - [ ] ……
        - [ ] ……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 已尝试的变通方式，以及为什么不足。

  - type: dropdown
    id: area
    attributes:
      label: 主要领域
      options:
        - Agent 工具循环
        - Provider / 路由 / 翻译管线
        - 配置 / 信任 / 审批
        - Shell / Hook
        - MCP
        - LSP
        - 子 agent / 后台 worktree
        - 会话 / 记忆 / 压缩
        - JSON CLI / 预算 / 自动化
        - 文档 / 发布工程
        - 其他
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: 权限与数据边界
      description: 如果功能会读取/写入文件、启动进程、访问网络、继承环境变量、持久化内容或把数据发给第三方，请说明启用来源、审批点、上限和失败行为。
      placeholder: "不涉及；或：首次启动……需要审批，数据将发送到……"
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性影响
      description: 是否改变配置、退出码、JSON schema、会话格式、工具 schema 或跨平台行为？如何迁移？

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与实现
      options:
        - label: 我愿意在设计确认后提交 PR。

