[project]
name = "emiya-agent"
version = "0.1.0"
description = "多供应商、多智能体 AI 编程助手，支持自主编排与模型语言感知翻译"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["ai", "coding-agent", "cli", "mcp", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "anthropic>=0.116",
    "openai>=2.48.0",
    "mcp>=1.13",
    "rich>=13.9",
    "prompt-toolkit>=3.0.48",
    "pydantic>=2.9",
    "tomlkit>=0.13",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
emiya = "emiya_agent.cli:main"

[project.urls]
Homepage = "https://github.com/xiaohuanemiya/EmiyaAgent"
Documentation = "https://github.com/xiaohuanemiya/EmiyaAgent#readme"
Repository = "https://github.com/xiaohuanemiya/EmiyaAgent"
Issues = "https://github.com/xiaohuanemiya/EmiyaAgent/issues"
Changelog = "https://github.com/xiaohuanemiya/EmiyaAgent/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emiya_agent"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.emiyacode",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.uv-cache",
    "/.venv",
    "/dist",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
